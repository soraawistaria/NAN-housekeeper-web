<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- stlesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <!-- navbar -->
    <div class="navbar">
        <ul>
            <li> <a href="">Beranda</a> </li>
            <li> <a href="">Profil</a> </li>
            <li> <a href="">Masuk</a> </li> 
            <li> <a href="">Daftar</a> </li>
            <li> <a href="">Pemesanan</a> </li>
        </ul>
    </div>
    <!-- FORM YANG MASUK KE DATABASE -->
    <form action="" method="POST" enctype="multipart/form-data">

        <label for="nama">NAMA PEMESAN</label>
        <input type="text" name="nama" id="nama">

        <br>

        <label for="alamat">ALAMAT RUMAH</label>
        <input type="text" name="alamat" id="alamat">

        <br>

        <label for="nowa">NOMOR WHATSAPP</label>
        <input type="text" name="nomor" id="nowa">

        <br>

        <label for="luas rumah">LUAS RUANGAN</label>
        <input type="number" name="luas" id="luasrumah">

        <br>

        <label for="pilihan">WAKTU PEMBERSIHAN</label>
        <select name="pilihan" id="pilihan">
            <option value="pagi">08.00</option>
            <option value="siang">13.00</option>
            <option value="malam">19.00</option>
        </select>
    
        <br>

        <label for="harga">HARGA</label>
        <input type="text" name="harga" id="harga" placeholder="Akan terhitung otomatis ketika tombol dibawah ditekan">

        <br>

        <button type="submit" name="action" value="pesan">PESAN</button>

<script src="script.js"></script>
</body>
</html>
