<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- stlesheet -->

<body>
    <nav class="navbar">
        <a href="index.html">Beranda</a>
        <a href="profile.html">Profil</a>
        <a href="masuk.html">Masuk</a>
        <a href="daftar.html">Daftar</a>
        <a href="#">Pemesanan</a>
    </nav>

    
    <!-- FORM YANG MASUK KE DATABASE -->
    <div class="form-container">
        <form action="" method="POST" enctype="multipart/form-data">

            <div class="kotak-input">
                <label for="nama">NAMA PEMESAN</label>
                <input type="text" name="nama" id="nama">
            </div>

            <br>

            <div class="kotak-input">
                <label for="alamat">ALAMAT RUMAH</label>
                <input type="text" name="alamat" id="alamat">
            </div>

            <br>

            <div class="kotak-input">
                <label for="nowa">NOMOR WHATSAPP</label>
                <input type="text" name="nomor" id="nowa">
            </div>

            <br>

            <div class="kotak-input">
                <label for="luas rumah">LUAS RUANGAN</label>
                <input type="number" name="luas" id="luasrumah">
            </div>

            <br>
            
            <div class="kotak-input">
                <label for="pilihan">WAKTU PEMBERSIHAN</label>
                <select name="pilihan" id="pilihan">
                    <option value="pagi">08.00</option>
                    <option value="siang">13.00</option>
                    <option value="malam">19.00</option>
                </select>
            </div>
        
            <br>

            <div class="kotak-input">
                <p>
                    Harga akan otomatis muncul ketika anda telah mengklik tombol dibawah ini!
                    Silahkan klik dan konfirmasi sekali lagi.
                </p>
            </div>

            <br>

            <button type="submit" name="action" value="pesan" onclick="hitungDanKonfirmasi()">PESAN</button>
        </form>
    </div>

<script src="script.js"></script>
</body>
</html>
